name: MLB model CI

on:
  push:
    branches: [main, organize-pitcher-model-v3, hybrid-market-model, test-rest-features, pregame-context-v2, elo-market-v3, pitcher-k-props-v1, pitcher-k-props-v2]
    paths:
      - 'python/build_pitcher_model.py'
      - 'python/compare_feature_sets.py'
      - 'python/evaluate_clean_market.py'
      - 'python/test_market_hybrid.py'
      - 'python/test_rest_features.py'
      - 'python/test_bullpen_features.py'
      - 'python/test_bullpen_ablation.py'
      - 'python/test_elo_features.py'
      - 'python/test_elo_tuning.py'
      - 'python/build_pitcher_k_model.py'
      - 'python/test_pitcher_k_components.py'
      - 'python/test_pitcher_k_ensemble.py'
      - 'python/test_pitcher_k_distribution.py'
      - 'requirements.txt'
      - '.github/workflows/model-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/build_pitcher_model.py'
      - 'python/compare_feature_sets.py'
      - 'python/evaluate_clean_market.py'
      - 'python/test_market_hybrid.py'
      - 'python/test_rest_features.py'
      - 'python/test_bullpen_features.py'
      - 'python/test_bullpen_ablation.py'
      - 'python/test_elo_features.py'
      - 'python/test_elo_tuning.py'
      - 'python/build_pitcher_k_model.py'
      - 'python/test_pitcher_k_components.py'
      - 'python/test_pitcher_k_ensemble.py'
      - 'python/test_pitcher_k_distribution.py'
      - 'requirements.txt'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full pitcher-aware walk-forward backtest
        run: python python/build_pitcher_model.py
      - name: Compare pitcher, team, and combined feature sets
        run: python python/compare_feature_sets.py
      - name: Validate market prices and rerun ROI evaluation
        run: python python/evaluate_clean_market.py
      - name: Test market plus baseball hybrid
        run: python python/test_market_hybrid.py
      - name: Test team and starter rest features
        run: python python/test_rest_features.py
      - name: Test bullpen workload features
        run: python python/test_bullpen_features.py
      - name: Ablate bullpen features individually
        run: python python/test_bullpen_ablation.py
      - name: Test Elo strength feature
        run: python python/test_elo_features.py
      - name: Tune Elo and test market incremental value
        run: python python/test_elo_tuning.py
      - name: Build and walk-forward test pitcher strikeout model
        run: python python/build_pitcher_k_model.py
      - name: Test BF x K-rate component model
        run: python python/test_pitcher_k_components.py
      - name: Test specialized BF x K-rate ensemble
        run: python python/test_pitcher_k_ensemble.py
      - name: Test pitcher K distribution calibration
        run: python python/test_pitcher_k_distribution.py
      - name: Upload model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitcher-model-outputs
          path: outputs/
          if-no-files-found: warn
