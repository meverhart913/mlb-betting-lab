name: Pitcher K V2.2 lineup handedness research
on:
  push:
    branches: [main, pitcher-k-v22-lineup-hand, pitcher-k-v22-market-validation]
    paths:
      - '.github/workflows/pitcher-k-v22-lineup-hand.yml'
      - 'python/backfill_batter_k_hand_splits.py'
      - 'python/backfill_historical_starting_lineups.py'
      - 'python/backfill_pitcher_handedness.py'
      - 'python/backfill_statcast_pitch_features.py'
      - 'python/build_batter_k_hand_rolling.py'
      - 'python/build_statcast_rolling_features.py'
      - 'python/build_historical_lineup_hand_features.py'
      - 'python/test_pitcher_k_batter_hand_features.py'
      - 'python/build_pitcher_k_model.py'
      - 'python/test_pitcher_k_ensemble.py'
      - 'python/prepare_free_pitcher_k_backtest.py'
      - 'python/backtest_pitcher_k_market.py'
      - 'data/market/free_pitcher_k_archive_graded.csv'
  workflow_dispatch:
jobs:
  historical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {year: [2021, 2022, 2023, 2024, 2025, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Backfill season matchup inputs
        shell: bash
        run: |
          END="${{ matrix.year }}-10-31"; [ "${{ matrix.year }}" = "2026" ] && END="2026-08-25"
          python python/backfill_batter_k_hand_splits.py --start "${{ matrix.year }}-03-15" --end "$END" --chunk-days 3 --sleep-seconds .2
          mv data/features/batter_k_by_pitcher_hand_daily.csv "data/features/batter_hand_${{ matrix.year }}.csv"
          python python/backfill_historical_starting_lineups.py --start "${{ matrix.year }}-03-15" --end "$END"
          mv data/features/historical_starting_lineups.csv "data/features/lineups_${{ matrix.year }}.csv"
      - uses: actions/upload-artifact@v4
        with: {name: 'v22-matchup-${{ matrix.year }}', path: 'data/features/*_${{ matrix.year }}.csv', retention-days: 7}

  statcast-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {year: [2021, 2022, 2023, 2024, 2025, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Backfill season Statcast pitcher features
        shell: bash
        run: |
          END="${{ matrix.year }}-10-31"; [ "${{ matrix.year }}" = "2026" ] && END="2026-08-25"
          python python/backfill_statcast_pitch_features.py --start "${{ matrix.year }}-03-15" --end "$END" --chunk-days 3 --sleep-seconds .2
          mv data/features/statcast_pitcher_daily.csv "data/features/statcast_pitcher_${{ matrix.year }}.csv"
      - uses: actions/upload-artifact@v4
        with: {name: 'v22-statcast-${{ matrix.year }}', path: 'data/features/statcast_pitcher_${{ matrix.year }}.csv', retention-days: 7}

  test-v22:
    needs: [historical-data, statcast-data]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: 'v22-*', path: parts}
      - name: Combine historical inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          Path('data/features').mkdir(parents=True,exist_ok=True)
          specs=[
            ('batter_hand_*.csv','batter_k_by_pitcher_hand_daily.csv',['game_date','batter_id','pitcher_hand']),
            ('lineups_*.csv','historical_starting_lineups.csv',['game_pk','team_id','batting_order']),
            ('statcast_pitcher_*.csv','statcast_pitcher_daily.csv',['game_date','pitcher_id']),
          ]
          for pat,out,keys in specs:
              fs=list(Path('parts').rglob(pat))
              if not fs: raise SystemExit(f'No artifacts matching {pat}')
              z=pd.concat([pd.read_csv(f,low_memory=False) for f in fs],ignore_index=True,sort=False)
              z=z.drop_duplicates(keys,keep='last')
              z.to_csv('data/features/'+out,index=False)
              print(out,len(z))
          PY
      - name: Build leakage-safe rolling features
        run: |
          python python/build_batter_k_hand_rolling.py
          python python/build_statcast_rolling_features.py
      - name: Build fast pitcher handedness lookup
        run: python python/backfill_pitcher_handedness.py --batch-size 50
      - name: Build opponent-specific historical lineup features
        run: python python/build_historical_lineup_hand_features.py
      - name: Run V2.2 walk-forward challenger
        run: python python/test_pitcher_k_batter_hand_features.py
      - name: Prepare accumulated free market archive
        run: python python/prepare_free_pitcher_k_backtest.py
      - name: Run V2.2 free market ROI test
        run: python python/backtest_pitcher_k_market.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitcher-k-v22-results
          path: |
            data/features/pitcher_handedness.csv
            data/features/historical_starting_lineups.csv
            data/features/historical_lineup_hand_features.csv
            data/features/batter_k_by_pitcher_hand_pregame.csv
            data/features/statcast_pitcher_pregame.csv
            data/market/pitcher_k_historical_raw.csv
            outputs/pitcher_k_batter_hand_metrics.csv
            outputs/pitcher_k_batter_hand_summary.csv
            outputs/pitcher_k_batter_hand_predictions.csv
            outputs/pitcher_k_market_graded.csv
            outputs/pitcher_k_market_threshold_summary.csv
            outputs/pitcher_k_market_year_summary.csv
          retention-days: 30
