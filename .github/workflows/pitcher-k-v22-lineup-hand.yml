name: Pitcher K V2.2 lineup handedness research
on:
  push:
    branches: [pitcher-k-v22-lineup-hand]
  workflow_dispatch:
jobs:
  historical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Backfill batter K by opposing hand
        shell: bash
        run: |
          END="${{ matrix.year }}-10-31"; [ "${{ matrix.year }}" = "2026" ] && END="2026-08-24"
          python python/backfill_batter_k_hand_splits.py --start "${{ matrix.year }}-03-15" --end "$END" --chunk-days 3 --sleep-seconds .2
          mv data/features/batter_k_by_pitcher_hand_daily.csv "data/features/batter_hand_${{ matrix.year }}.csv"
      - name: Backfill historical starting lineups
        shell: bash
        run: |
          END="${{ matrix.year }}-10-31"; [ "${{ matrix.year }}" = "2026" ] && END="2026-08-24"
          python python/backfill_historical_starting_lineups.py --start "${{ matrix.year }}-03-15" --end "$END"
          mv data/features/historical_starting_lineups.csv "data/features/lineups_${{ matrix.year }}.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: v22-${{ matrix.year }}
          path: data/features/*_${{ matrix.year }}.csv
          retention-days: 7
  test-v22:
    needs: historical-data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: 'v22-*', path: parts}
      - name: Combine historical inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          Path('data/features').mkdir(parents=True,exist_ok=True)
          for pat,out in [('batter_hand_*.csv','batter_k_by_pitcher_hand_daily.csv'),('lineups_*.csv','historical_starting_lineups.csv')]:
              fs=list(Path('parts').rglob(pat)); z=pd.concat([pd.read_csv(f,low_memory=False) for f in fs],ignore_index=True); z.to_csv('data/features/'+out,index=False); print(out,len(z))
          PY
      - run: python python/build_batter_k_hand_rolling.py
      - run: python python/backfill_pitcher_handedness.py --start 2021-03-15 --end 2026-08-24 --chunk-days 3 --sleep-seconds .2
      - name: Restore validated Statcast rolling features
        run: |
          python python/backfill_statcast_pitch_features.py --start 2021-03-15 --end 2026-08-24 --chunk-days 3 --sleep-seconds .2
          python python/build_statcast_rolling_features.py
      - run: python python/test_pitcher_k_batter_hand_features.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitcher-k-v22-results
          path: |
            data/features/pitcher_handedness.csv
            data/features/historical_starting_lineups.csv
            data/features/batter_k_by_pitcher_hand_pregame.csv
            outputs/pitcher_k_batter_hand_metrics.csv
            outputs/pitcher_k_batter_hand_summary.csv
          retention-days: 30
