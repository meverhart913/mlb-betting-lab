name: Fast Python CI

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/fast-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q python tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
