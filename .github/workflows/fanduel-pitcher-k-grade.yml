name: FanDuel pitcher K paper grading

on:
  push:
    branches: [main]
    paths:
      - 'python/grade_fanduel_pitcher_k_paper.py'
      - 'python/summarize_fanduel_failure_regimes.py'
      - '.github/workflows/fanduel-pitcher-k-grade.yml'
  schedule:
    - cron: '15 14 * 4-10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh recent MLB results
        run: python python/refresh_recent_mlb.py --lookback-days 4
      - name: Grade frozen FanDuel paper selections and CLV
        run: python python/grade_fanduel_pitcher_k_paper.py
      - name: Summarize failure regimes
        run: python python/summarize_fanduel_failure_regimes.py
      - name: Commit enriched paper ledger
        shell: bash
        run: |
          if [ ! -f data/current/fanduel_pitcher_k_paper_history.csv ]; then
            echo 'No paper ledger exists yet.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current/fanduel_pitcher_k_paper_history.csv
          if git diff --cached --quiet; then
            echo 'No grading updates.'
          else
            git commit -m 'Grade FanDuel pitcher K paper selections'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Write grading summary
        if: always()
        shell: bash
        run: |
          echo '## FanDuel pitcher K prospective grading' >> "$GITHUB_STEP_SUMMARY"
          if [ -f outputs/fanduel_pitcher_k_paper_summary.csv ]; then
            echo '### Thresholds / calibration / CLV' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/fanduel_pitcher_k_paper_summary.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No settled paper selections yet.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s outputs/fanduel_pitcher_k_failure_regime_summary.csv ]; then
            echo '### Failure regimes' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/fanduel_pitcher_k_failure_regime_summary.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s outputs/fanduel_pitcher_k_model_version_summary.csv ]; then
            echo '### Model versions' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/fanduel_pitcher_k_model_version_summary.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanduel-paper-grading-${{ github.run_id }}
          path: |
            outputs/fanduel_pitcher_k_paper_graded.csv
            outputs/fanduel_pitcher_k_paper_summary.csv
            outputs/fanduel_pitcher_k_calibration.csv
            outputs/fanduel_pitcher_k_model_version_summary.csv
            outputs/fanduel_pitcher_k_failure_regime_summary.csv
            data/current/fanduel_pitcher_k_paper_history.csv
          if-no-files-found: warn
          retention-days: 90
