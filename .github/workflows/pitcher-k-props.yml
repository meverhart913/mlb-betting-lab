name: Pitcher K props

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pitcher-k-props.yml'
      - 'python/build_fanduel_paper_bets.py'
  schedule:
    - cron: '0 16 * 4-10 *'
  workflow_dispatch:

jobs:
  pitcher-k-props:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDS_API_CREDIT_RESERVE: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check MLB slate
        id: slate
        shell: bash
        run: |
          HAS_GAMES="$(python python/check_mlb_slate.py)"
          echo "has_games=$HAS_GAMES" >> "$GITHUB_OUTPUT"
      - name: Restore research history
        if: steps.slate.outputs.has_games == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/current/pitcher_k_props_history.csv
            data/current/pitcher_k_props_raw_history.csv
            data/current/pitcher_k_projection_history.csv
            data/current/fanduel_paper_bets_history.csv
          key: pitcher-k-prop-history-${{ github.run_id }}
          restore-keys: pitcher-k-prop-history-
      - name: Refresh recent MLB logs
        if: steps.slate.outputs.has_games == 'true'
        run: python python/refresh_recent_mlb.py --lookback-days 4
      - name: Build model
        if: steps.slate.outputs.has_games == 'true'
        run: |
          python python/build_pitcher_k_model.py
          python python/test_pitcher_k_components.py
          python python/test_pitcher_k_ensemble.py
      - name: Pull current sportsbook props
        if: steps.slate.outputs.has_games == 'true'
        run: python python/fetch_pitcher_k_props.py
      - name: Pull free FanDuel market snapshot
        if: steps.slate.outputs.has_games == 'true'
        run: python python/fetch_propline_sample.py
      - name: Price current projections
        if: steps.slate.outputs.has_games == 'true'
        run: |
          python python/build_pitcher_k_line_movement.py
          python python/run_pitcher_k_props.py
          python python/reprice_pitcher_k_predictions.py
      - name: Freeze FanDuel alt-K paper selections
        if: steps.slate.outputs.has_games == 'true'
        run: python python/build_fanduel_paper_bets.py
      - name: Grade prospective projections
        if: steps.slate.outputs.has_games == 'true'
        run: python python/grade_pitcher_k_projections.py
      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo '## FanDuel-primary pitcher K research' >> "$GITHUB_STEP_SUMMARY"
          echo 'Research only. One highest-EV FanDuel alt-K paper wager per pitcher/start.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f outputs/fanduel_paper_selections.csv ]; then
            echo '### Frozen FanDuel paper selections' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -n 30 outputs/fanduel_paper_selections.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.slate.outputs.has_games == 'true'
        with:
          name: pitcher-k-props-${{ github.run_id }}
          path: |
            outputs/pitcher_k_prop_predictions.csv
            outputs/fanduel_alt_k_candidates.csv
            outputs/fanduel_paper_selections.csv
            outputs/pitcher_k_prospective_graded.csv
            outputs/pitcher_k_prospective_summary.csv
            data/current/fanduel_paper_bets_history.csv
            data/current/pitcher_k_collection_status.csv
            data/current/pitcher_k_props_raw.csv
            data/market/pitcher_k_historical_raw.csv
          if-no-files-found: warn
          retention-days: 90
