name: Morning MLB model

on:
  schedule:
    # 12:00 UTC = 8:00 AM Eastern during MLB daylight-saving months.
    - cron: '0 12 * 4-10 *'
  workflow_dispatch:
    inputs:
      game_date:
        description: 'Optional YYYY-MM-DD date (defaults to today)'
        required: false
        type: string

jobs:
  morning-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine target slate
        id: slate
        shell: bash
        run: |
          if [ -n "${{ inputs.game_date }}" ]; then
            GAME_DATE="${{ inputs.game_date }}"
          else
            GAME_DATE="$(date +%F)"
          fi
          HAS_GAMES="$(python python/check_mlb_slate.py --date "$GAME_DATE")"
          echo "game_date=$GAME_DATE" >> "$GITHUB_OUTPUT"
          echo "has_games=$HAS_GAMES" >> "$GITHUB_OUTPUT"
          echo "Target date $GAME_DATE; has regular-season games: $HAS_GAMES"

      - name: Restore rolling odds history
        if: steps.slate.outputs.has_games == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/current/odds_consensus_history.csv
            data/current/odds_raw_history.csv
          key: odds-history-${{ github.run_id }}
          restore-keys: |
            odds-history-

      - name: Refresh recent MLB results and pitcher/team logs
        if: steps.slate.outputs.has_games == 'true'
        run: python python/refresh_recent_mlb.py --lookback-days 4

      - name: Rebuild leakage-safe historical modeling table
        if: steps.slate.outputs.has_games == 'true'
        run: python python/build_pitcher_model.py

      - name: Pull current sportsbook moneylines
        if: steps.slate.outputs.has_games == 'true'
        run: python python/fetch_morning_odds.py

      - name: Capture bullpen workload context
        if: steps.slate.outputs.has_games == 'true'
        run: python python/fetch_bullpen_context.py --date "${{ steps.slate.outputs.game_date }}"

      - name: Capture roster and IL context
        if: steps.slate.outputs.has_games == 'true'
        run: python python/fetch_roster_context.py --date "${{ steps.slate.outputs.game_date }}"

      - name: Capture posted lineup context
        if: steps.slate.outputs.has_games == 'true'
        run: python python/fetch_lineup_context.py --date "${{ steps.slate.outputs.game_date }}"

      - name: Capture venue and weather context
        if: steps.slate.outputs.has_games == 'true'
        run: python python/fetch_morning_context.py --date "${{ steps.slate.outputs.game_date }}"

      - name: Run tuned Elo morning model
        if: steps.slate.outputs.has_games == 'true'
        run: python python/run_morning_model_elo.py --date "${{ steps.slate.outputs.game_date }}"

      - name: Build combined morning report
        if: steps.slate.outputs.has_games == 'true'
        run: python python/build_morning_report.py

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo '## Morning MLB model' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.slate.outputs.has_games }}" != "true" ]; then
            echo 'No MLB regular-season games on the target date. No Odds API quota was used.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -f outputs/morning_report.csv ]; then
            echo 'Automated morning report generated with tuned Elo. Model decisions remain NO BET because the market still outperforms the baseball model.' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -n 20 outputs/morning_report.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No combined morning report was generated. Inspect the failed step above.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload morning outputs
        if: always() && steps.slate.outputs.has_games == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: morning-mlb-${{ github.run_id }}
          path: |
            outputs/morning_model_predictions.csv
            outputs/morning_report.csv
            data/current/morning_odds.csv
            data/current/morning_odds_raw.csv
            data/current/odds_consensus_history.csv
            data/current/odds_raw_history.csv
            data/current/morning_context.csv
            data/current/bullpen_context.csv
            data/current/roster_context.csv
            data/current/injured_list_players.csv
            data/current/recent_roster_transactions.csv
            data/current/lineup_context.csv
            data/current/lineup_players.csv
          if-no-files-found: warn
          retention-days: 30
