name: Pitcher K free market archive

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pitcher-k-free-market-archive.yml']
  schedule:
    # Four snapshots per MLB day during the regular season. UTC times roughly
    # correspond to late morning through evening US Eastern during DST.
    - cron: '30 14,17,20,23 * 4-10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch free PropLine pitcher-K sample
        run: python python/fetch_propline_sample.py
      - name: Archive normalized sample
        shell: bash
        run: |
          read DAY STAMP <<< "$(python - <<'PY'
          import pandas as pd
          from datetime import datetime, timezone
          p='data/market/pitcher_k_historical_raw.csv'
          d=pd.read_csv(p)
          day=str(pd.to_datetime(d['date']).dt.date.max())
          stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          print(day, stamp)
          PY
          )"
          mkdir -p "data/market/free_archive/${DAY}"
          cp data/market/pitcher_k_historical_raw.csv "data/market/free_archive/${DAY}/propline_pitcher_k_${STAMP}.csv"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market/free_archive/
          if git diff --cached --quiet; then
            echo 'No new market archive changes.'
          else
            git commit -m "Archive free PropLine pitcher K sample ${DAY} ${STAMP}"
            git push origin HEAD:main
          fi
