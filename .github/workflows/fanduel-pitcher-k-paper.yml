name: FanDuel V2.2 pitcher K paper

on:
  # Scheduled/manual only: avoid paid market pulls on code merges.
  schedule:
    # 10:45am, 1:45pm, 4:45pm, 7:45pm ET during daylight time.
    # These align with the major MLB start-time clusters while controlling API spend.
    - cron: '45 14,17,20,23 * 4-10 *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDS_API_CREDIT_RESERVE: '30'
      FANDUEL_ODDS_HORIZON_HOURS: '4.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check MLB slate
        id: prereq
        shell: bash
        run: |
          HAS_GAMES="$(python python/check_mlb_slate.py)"
          if [ -n "$PROPLINE_API_KEY" ]; then HAS_PROPLINE=true; else HAS_PROPLINE=false; fi
          if [ -n "$THE_ODDS_API_KEY" ]; then HAS_ODDS=true; else HAS_ODDS=false; fi
          echo "has_games=$HAS_GAMES" >> "$GITHUB_OUTPUT"
          echo "has_propline=$HAS_PROPLINE" >> "$GITHUB_OUTPUT"
          echo "has_odds=$HAS_ODDS" >> "$GITHUB_OUTPUT"
          echo "Has regular-season games: $HAS_GAMES"
          echo "PropLine live key configured: $HAS_PROPLINE"
          echo "Odds API current-quote source configured: $HAS_ODDS"

      - name: Download V2.2 research and freshest live feature data
        if: steps.prereq.outputs.has_games == 'true'
        shell: bash
        run: |
          RUN_ID="$(gh run list --workflow 'Pitcher K V2.2 lineup handedness research' --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo 'No successful V2.2 run found on main.'
            exit 1
          fi
          echo "Using V2.2 research run $RUN_ID"
          mkdir -p latest data/features
          gh run download "$RUN_ID" -n pitcher-k-v22-results -D latest
          cp latest/data/features/pitcher_handedness.csv data/features/
          cp latest/data/features/historical_lineup_hand_features.csv data/features/
          cp latest/data/features/statcast_pitcher_pregame.csv data/features/
          cp latest/data/features/batter_k_by_pitcher_hand_pregame.csv data/features/
          for Y in 2025 2026; do
            mkdir -p "parts/statcast_${Y}" "parts/matchup_${Y}"
            gh run download "$RUN_ID" -n "v22-statcast-${Y}" -D "parts/statcast_${Y}"
            gh run download "$RUN_ID" -n "v22-matchup-${Y}" -D "parts/matchup_${Y}"
          done
          find parts -type f -name 'statcast_pitcher_*.csv' -exec sh -c 'f="$1"; y=$(basename "$f" | sed -E "s/[^0-9]*([0-9]{4}).*/\\1/"); cp "$f" "data/features/statcast_pitcher_daily_${y}.csv"' _ {} \;
          find parts -type f -name 'batter_hand_*.csv' -exec sh -c 'f="$1"; y=$(basename "$f" | sed -E "s/[^0-9]*([0-9]{4}).*/\\1/"); cp "$f" "data/features/batter_k_by_pitcher_hand_daily_${y}.csv"' _ {} \;

          LIVE_RUN="$(gh run list --workflow 'V2.2 live feature refresh' --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$LIVE_RUN" ] && [ "$LIVE_RUN" != "null" ]; then
            echo "Overlaying daily live features from run $LIVE_RUN"
            mkdir -p live-current
            if gh run download "$LIVE_RUN" -n v22-live-current -D live-current; then
              find live-current -type f -name 'statcast_pitcher_daily_2026.csv' -exec cp {} data/features/statcast_pitcher_daily_2026.csv \;
              find live-current -type f -name 'batter_k_by_pitcher_hand_daily_2026.csv' -exec cp {} data/features/batter_k_by_pitcher_hand_daily_2026.csv \;
            fi
          else
            echo 'No successful lightweight live-feature refresh yet; using latest full V2.2 raw artifacts.'
          fi

      - name: Refresh recent completed MLB logs
        if: steps.prereq.outputs.has_games == 'true'
        run: python python/refresh_recent_mlb.py --lookback-days 4

      - name: Build live V2.2/V2.1 projections before quote collection
        if: steps.prereq.outputs.has_games == 'true'
        run: python python/build_fanduel_live_projections.py

      - name: Pull verified-current FanDuel pitcher-K board after model generation
        if: steps.prereq.outputs.has_games == 'true'
        shell: bash
        run: |
          if [ -n "$PROPLINE_API_KEY" ]; then
            echo 'Using PropLine live API.'
            python python/fetch_propline_live_fanduel.py
            cp data/market/pitcher_k_live_fanduel.csv data/market/pitcher_k_historical_raw.csv
          elif [ -n "$THE_ODDS_API_KEY" ]; then
            echo 'Using credit-aware Odds API current FanDuel main+alt board.'
            python python/fetch_oddsapi_live_fanduel.py
            if [ -s data/market/pitcher_k_live_fanduel.csv ]; then
              cp data/market/pitcher_k_live_fanduel.csv data/market/pitcher_k_historical_raw.csv
            else
              echo 'No eligible near-term FanDuel board yet.'
              : > data/market/pitcher_k_historical_raw.csv
            fi
          else
            echo 'No verified-current FanDuel quote source configured. Public PropLine sample is archive-only and will not be used for prospective decisions.'
            : > data/market/pitcher_k_historical_raw.csv
          fi

      - name: Persist FanDuel decision-cycle quote for CLV
        if: steps.prereq.outputs.has_games == 'true'
        run: python python/archive_fanduel_decision_snapshot.py

      - name: Price and freeze FanDuel paper selections
        if: steps.prereq.outputs.has_games == 'true'
        run: python python/select_fanduel_paper_from_live.py

      - name: Grade prior FanDuel selections and CLV
        if: steps.prereq.outputs.has_games == 'true'
        run: python python/grade_fanduel_pitcher_k_paper.py

      - name: Build mobile daily report
        if: steps.prereq.outputs.has_games == 'true'
        run: python python/build_fanduel_daily_report.py

      - name: Commit prospective paper and quote history
        if: steps.prereq.outputs.has_games == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/current/fanduel_pitcher_k_paper_history.csv ]; then
            git add data/current/fanduel_pitcher_k_paper_history.csv
          fi
          if [ -d data/market/free_archive ]; then
            git add data/market/free_archive
          fi
          if git diff --cached --quiet; then
            echo 'No prospective history changes.'
          else
            git commit -m 'Update FanDuel pitcher K prospective history'
            # Projection/refresh steps intentionally modify research files that are not
            # part of the prospective ledger. Preserve them locally while rebasing the
            # immutable history commit, then restore them for artifact/report output.
            git stash push --include-untracked --keep-index -m 'fanduel-workflow-transient' || true
            git pull --rebase origin main
            git push origin HEAD:main
            git stash pop || true
          fi

      - name: Write FanDuel paper summary
        if: always()
        shell: bash
        run: |
          echo '## FanDuel V2.2/V2.1 pitcher K paper trading' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Research only. No wagers are placed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Timing rule: projection and lineup inputs are built before a verified-current decision quote is collected.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Confirmed lineups use V2.2 lineup-handedness; missing lineups use V2.1 Statcast fallback.' >> "$GITHUB_STEP_SUMMARY"
          echo "PropLine live key: ${{ steps.prereq.outputs.has_propline }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Odds API current source: ${{ steps.prereq.outputs.has_odds }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.prereq.outputs.has_games }}" != "true" ]; then
            echo 'No MLB regular-season slate today.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -f outputs/fanduel_pitcher_k_daily_report.md ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/fanduel_pitcher_k_daily_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No eligible FanDuel selection was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/fanduel_pitcher_k_paper_summary.csv ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### Prospective grading / CLV / calibration' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/fanduel_pitcher_k_paper_summary.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/fanduel_pitcher_k_model_version_summary.csv ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### Model version split' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/fanduel_pitcher_k_model_version_summary.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/current/fanduel_oddsapi_status.csv ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '### Odds API credit status' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat data/current/fanduel_oddsapi_status.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.prereq.outputs.has_games == 'true'
        with:
          name: fanduel-v22-paper-${{ github.run_id }}
          path: |
            outputs/fanduel_pitcher_k_live_projections.csv
            outputs/fanduel_pitcher_k_daily_report.csv
            outputs/fanduel_pitcher_k_daily_report.md
            outputs/fanduel_pitcher_k_paper_today.csv
            outputs/fanduel_pitcher_k_all_candidates.csv
            outputs/fanduel_pitcher_k_paper_graded.csv
            outputs/fanduel_pitcher_k_paper_summary.csv
            outputs/fanduel_pitcher_k_calibration.csv
            outputs/fanduel_pitcher_k_model_version_summary.csv
            data/current/fanduel_pitcher_k_paper_history.csv
            data/current/fanduel_oddsapi_status.csv
            data/market/pitcher_k_historical_raw.csv
            data/market/pitcher_k_live_fanduel.csv
            data/market/pitcher_k_live_fanduel_all_outcomes.csv
          if-no-files-found: warn
          retention-days: 90
