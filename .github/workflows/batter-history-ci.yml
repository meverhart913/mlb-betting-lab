name: Batter history CI

on:
  push:
    branches: [batter-history-v1]
    paths:
      - 'python/backfill_batter_game_logs.py'
      - 'tests/test_batter_backfill.py'
      - '.github/workflows/batter-history-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/backfill_batter_game_logs.py'
      - 'tests/test_batter_backfill.py'
      - '.github/workflows/batter-history-*.yml'

concurrency:
  group: batter-history-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backfill script
        run: python -m py_compile python/backfill_batter_game_logs.py
      - name: Run batter backfill parser tests
        run: python -m unittest tests.test_batter_backfill -v
